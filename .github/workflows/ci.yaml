name: ci

on:
  pull_request:
  push:
    branches:
      - main
      - develop   # where the application repo bot pushes tag bumps

# Minimal permissions — only read access to repo contents.
# No write access needed for validation-only workflows.
permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      - name: Gitleaks
        run: |
          GITLEAKS_VERSION=8.21.2
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz | tar -xz gitleaks
          ./gitleaks detect --source . --redact --verbose --exit-code 1

      - name: Setup kustomize + kubeconform
        run: |
          curl -s "https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh" | bash -s 5.4.3
          curl -sL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz | tar xz
          sudo mv kustomize kubeconform /usr/local/bin/

      - name: Render and validate
        run: |
          kustomize build k8s/ > rendered.yaml

          # Validate against Kubernetes built-in schemas + CRD catalog.
          # The CRD catalog covers ServiceMonitor, PrometheusRule, HPA (autoscaling/v2),
          # PodDisruptionBudget, and other resources used in this repo.
          # -strict: reject unknown fields (catches typos in field names)
          # CRD catalog: https://github.com/datreeio/CRDs-catalog
          kubeconform \
            -strict \
            -summary \
            -schema-location default \
            -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
            rendered.yaml
