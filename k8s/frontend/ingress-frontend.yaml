apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: portal-frontend-ingress
  namespace: portal-dos-links
spec:
  ingressClassName: nginx
  rules:
    - host: portal.localdev
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: portal-frontend-svc
                port:
                  number: 80
