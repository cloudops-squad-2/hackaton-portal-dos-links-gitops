apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: portal-api-ingress
  namespace: portal-dos-links
spec:
  ingressClassName: nginx
  rules:
    - host: portal.localdev
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: portal-api-svc
                port:
                  number: 3000
          - path: /s
            pathType: Prefix
            backend:
              service:
                name: portal-api-svc
                port:
                  number: 3000
