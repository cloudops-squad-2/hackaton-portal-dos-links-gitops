apiVersion: apps/v1
kind: Deployment
metadata:
  name: portal-frontend
  namespace: portal-dos-links
  labels:
    app: portal-frontend
spec:
  # replicas: NOT SET — managed by HPA (k8s/frontend/hpa.yaml).
  selector:
    matchLabels:
      app: portal-frontend
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: portal-frontend
    spec:
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: portal-frontend

      containers:
        - name: portal-frontend
          image: ghcr.io/cloudops-squad-2/portal-dos-links-frontend
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 3

      # imagePullSecrets: [{name: ghcr-pull-secret}]  # apply as overlay patch if needed
