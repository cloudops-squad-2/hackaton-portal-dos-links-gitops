apiVersion: apps/v1
kind: Deployment
metadata:
  name: portal-api
  namespace: portal-dos-links
  labels:
    app: portal-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: portal-api
  template:
    metadata:
      labels:
        app: portal-api
    spec:
      initContainers:
        - name: prisma-migrate
          image: ghcr.io/cloudops-squad-2/portal-dos-links-api
          command: ["sh", "-c", "npx prisma migrate deploy --schema=prisma/schema.prisma"]
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: api-secret
                  key: DATABASE_URL
      containers:
        - name: portal-api
          image: ghcr.io/cloudops-squad-2/portal-dos-links-api
          ports:
            - containerPort: 3000
          envFrom:
            - configMapRef:
                name: api-config
            - secretRef:
                name: api-secret
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 3
