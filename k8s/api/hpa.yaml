apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: portal-api-hpa
  namespace: portal-dos-links
  annotations:
    # Must come AFTER the Deployment (wave 2). Otherwise the HPA is Degraded
    # ("target not found") in wave 0 and blocks the whole sync on a fresh install.
    argocd.argoproj.io/sync-wave: "3"
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: portal-api
  # min 2: always have two replicas for availability (PDB also enforces minAvailable: 1).
  minReplicas: 2
  # max 6: pool constraint — 6 × PG_POOL_MAX(10) = 60 <= 80% of max_connections(100).
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
  behavior:
    scaleDown:
      # Wait 5 minutes before scaling down to avoid thrashing on bursty traffic.
      stabilizationWindowSeconds: 300
