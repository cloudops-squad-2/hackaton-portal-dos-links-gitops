apiVersion: v1
kind: Secret
metadata:
  name: api-secret
  namespace: portal-dos-links
type: Opaque
stringData:
  # Full Postgres connection string — copy this file to secret.yaml and fill in your password.
  # Rules:
  #   - Host must be "postgres-svc" (the Kubernetes Service name, not localhost)
  #   - Database name ("portal") must match POSTGRES_DB in k8s/database/secret.yaml
  #   - Password must be URL-encoded: replace special chars (e.g. "@" → "%40", "#" → "%23")
  #   - The key name DATABASE_URL is required — the API calls getOrThrow('DATABASE_URL')
  DATABASE_URL: "postgres://portal:REPLACE_PASSWORD_URL_ENCODED@postgres-svc:5432/portal"
