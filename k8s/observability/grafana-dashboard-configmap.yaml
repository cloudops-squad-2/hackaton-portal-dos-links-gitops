apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-portal-dashboard
  namespace: portal-dos-links
  labels:
    grafana_dashboard: "1"
data:
  portal-dos-links-dashboard.json: |
    {
      "uid": "portal-dos-links",
      "title": "Portal dos Links",
      "schemaVersion": 36,
      "version": 1,
      "refresh": "30s",
      "time": { "from": "now-1h", "to": "now" },
      "panels": [
        {
          "id": 1,
          "type": "timeseries",
          "title": "Cliques por minuto",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 0 },
          "datasource": "Prometheus",
          "targets": [
            {
              "expr": "rate(http_server_duration_count{http_route=~\"/s/.*\"}[1m])",
              "legendFormat": "cliques/min",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "reqps",
              "color": { "mode": "palette-classic" }
            }
          }
        },
        {
          "id": 2,
          "type": "timeseries",
          "title": "Latencia p99",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 0 },
          "datasource": "Prometheus",
          "targets": [
            {
              "expr": "histogram_quantile(0.99, sum(rate(http_server_duration_bucket[5m])) by (le))",
              "legendFormat": "p99",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "ms",
              "color": { "mode": "palette-classic" }
            }
          }
        },
        {
          "id": 3,
          "type": "timeseries",
          "title": "Taxa de erros",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 8 },
          "datasource": "Prometheus",
          "targets": [
            {
              "expr": "rate(http_server_duration_count{http_status_code=~\"5..\"}[1m])",
              "legendFormat": "5xx/min",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "reqps",
              "color": { "mode": "fixed", "fixedColor": "red" }
            }
          }
        },
        {
          "id": 4,
          "type": "stat",
          "title": "Servicos saudaveis",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 8 },
          "datasource": "Prometheus",
          "targets": [
            {
              "expr": "sum(kube_pod_status_ready{namespace=\"portal-dos-links\",condition=\"true\"})",
              "legendFormat": "pods prontos",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "red", "value": null },
                  { "color": "yellow", "value": 1 },
                  { "color": "green", "value": 3 }
                ]
              },
              "color": { "mode": "thresholds" }
            }
          },
          "options": {
            "reduceOptions": { "calcs": ["lastNotNull"] },
            "orientation": "auto",
            "textMode": "auto",
            "colorMode": "background"
          }
        }
      ]
    }