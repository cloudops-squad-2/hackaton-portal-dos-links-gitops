apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-portal-dashboard
  namespace: portal-dos-links
  labels:
    # Grafana sidecar discovers ConfigMaps with this label from all namespaces
    # (configured via searchNamespace: ALL in kube-prometheus-stack values).
    grafana_dashboard: "1"
data:
  portal-dos-links-dashboard.json: |
    {
      "uid": "portal-dos-links",
      "title": "Portal dos Links",
      "schemaVersion": 38,
      "version": 2,
      "refresh": "30s",
      "time": { "from": "now-1h", "to": "now" },
      "templating": {
        "list": [
          {
            "name": "datasource",
            "type": "datasource",
            "pluginId": "prometheus",
            "label": "Prometheus",
            "hide": 0,
            "refresh": 1,
            "current": {}
          }
        ]
      },
      "panels": [
        {
          "id": 1,
          "type": "timeseries",
          "title": "Redirects por segundo (links.redirected)",
          "description": "Rate of successful link redirects. Uses links_redirected_total counter. Metric names verified from :8889/metrics — see T5 acceptance checklist.",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "targets": [
            {
              "expr": "sum(rate(links_redirected_total[2m]))",
              "legendFormat": "redirects/s",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "ops",
              "color": { "mode": "palette-classic" }
            }
          }
        },
        {
          "id": 2,
          "type": "timeseries",
          "title": "Links criados por segundo",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "targets": [
            {
              "expr": "sum(rate(links_created_total[2m]))",
              "legendFormat": "criações/s",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "ops",
              "color": { "mode": "palette-classic" }
            }
          }
        },
        {
          "id": 3,
          "type": "timeseries",
          "title": "Erros de negócio (expirados / não encontrados / limite de cliques)",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 8 },
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "targets": [
            {
              "expr": "sum(rate(links_expired_total[2m]))",
              "legendFormat": "expirados/s",
              "refId": "A"
            },
            {
              "expr": "sum(rate(links_not_found_total[2m]))",
              "legendFormat": "não encontrados/s",
              "refId": "B"
            },
            {
              "expr": "sum(rate(links_click_limit_reached_total[2m]))",
              "legendFormat": "limite de cliques/s",
              "refId": "C"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "ops",
              "color": { "mode": "palette-classic" }
            }
          }
        },
        {
          "id": 4,
          "type": "timeseries",
          "title": "Latência HTTP p50 / p95 / p99",
          "description": "Metric: http_server_request_duration_seconds_bucket. Requires OTEL_SEMCONV_STABILITY_OPT_IN=http. Verify name from :8889/metrics before accepting T5.",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 8 },
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "targets": [
            {
              "expr": "histogram_quantile(0.50, sum(rate(http_server_request_duration_seconds_bucket{job=\"otel-collector\"}[2m])) by (le))",
              "legendFormat": "p50",
              "refId": "A"
            },
            {
              "expr": "histogram_quantile(0.95, sum(rate(http_server_request_duration_seconds_bucket{job=\"otel-collector\"}[2m])) by (le))",
              "legendFormat": "p95",
              "refId": "B"
            },
            {
              "expr": "histogram_quantile(0.99, sum(rate(http_server_request_duration_seconds_bucket{job=\"otel-collector\"}[2m])) by (le))",
              "legendFormat": "p99",
              "refId": "C"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "color": { "mode": "palette-classic" }
            }
          }
        },
        {
          "id": 5,
          "type": "timeseries",
          "title": "Taxa de erros HTTP 5xx (%)",
          "description": "Metric: http_server_request_duration_seconds_count with http_response_status_code label. Verify label name from :8889/metrics.",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 16 },
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "targets": [
            {
              "expr": "sum(rate(http_server_request_duration_seconds_count{http_response_status_code=~\"5..\"}[2m])) / sum(rate(http_server_request_duration_seconds_count[2m])) * 100",
              "legendFormat": "5xx %",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "color": { "mode": "fixed", "fixedColor": "red" },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "yellow", "value": 1 },
                  { "color": "red", "value": 2 }
                ]
              }
            }
          }
        },
        {
          "id": 6,
          "type": "stat",
          "title": "Pods prontos por Deployment",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 16 },
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "targets": [
            {
              "expr": "kube_deployment_status_replicas_ready{namespace=\"portal-dos-links\",deployment=\"portal-api\"}",
              "legendFormat": "API",
              "refId": "A"
            },
            {
              "expr": "kube_deployment_status_replicas_ready{namespace=\"portal-dos-links\",deployment=\"portal-frontend\"}",
              "legendFormat": "Frontend",
              "refId": "B"
            },
            {
              "expr": "kube_deployment_status_replicas_ready{namespace=\"portal-dos-links\",deployment=\"otel-collector\"}",
              "legendFormat": "Collector",
              "refId": "C"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "red", "value": null },
                  { "color": "yellow", "value": 1 },
                  { "color": "green", "value": 2 }
                ]
              },
              "color": { "mode": "thresholds" }
            }
          },
          "options": {
            "reduceOptions": { "calcs": ["lastNotNull"] },
            "orientation": "horizontal",
            "textMode": "auto",
            "colorMode": "background"
          }
        },
        {
          "id": 7,
          "type": "timeseries",
          "title": "HPA réplicas atuais vs máximo",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 24 },
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "targets": [
            {
              "expr": "kube_horizontalpodautoscaler_status_current_replicas{namespace=\"portal-dos-links\"}",
              "legendFormat": "atual — {{horizontalpodautoscaler}}",
              "refId": "A"
            },
            {
              "expr": "kube_horizontalpodautoscaler_spec_max_replicas{namespace=\"portal-dos-links\"}",
              "legendFormat": "máximo — {{horizontalpodautoscaler}}",
              "refId": "B"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "color": { "mode": "palette-classic" }
            }
          }
        },
        {
          "id": 8,
          "type": "timeseries",
          "title": "Falhas de envio do Collector (otelcol_*)",
          "description": "Alert fires when this is > 0. See alert CollectorExportFailures.",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 24 },
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "targets": [
            {
              "expr": "sum(increase(otelcol_exporter_send_failed_spans_total[2m]))",
              "legendFormat": "spans falhados (2m)",
              "refId": "A"
            },
            {
              "expr": "sum(increase(otelcol_processor_refused_spans_total[2m]))",
              "legendFormat": "spans recusados processor (2m)",
              "refId": "B"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "color": { "mode": "fixed", "fixedColor": "orange" }
            }
          }
        }
      ]
    }
