apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: otel-collector-hpa
  namespace: portal-dos-links
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: otel-collector
  minReplicas: 2
  maxReplicas: 4
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 80
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          # Scale out before memory_limiter starts dropping data.
          # At 70% of 512Mi (~358Mi) we still have headroom before the 80% soft limit.
          averageUtilization: 70
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
