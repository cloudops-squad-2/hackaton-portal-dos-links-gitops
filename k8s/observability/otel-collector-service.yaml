apiVersion: v1
kind: Service
metadata:
  name: otel-collector
  namespace: portal-dos-links
  labels:
    app: otel-collector
spec:
  type: ClusterIP
  selector:
    app: otel-collector
  ports:
    - name: otlp-grpc
      port: 4317
      targetPort: 4317
      protocol: TCP
    - name: prometheus
      port: 8889
      targetPort: 8889
      protocol: TCP